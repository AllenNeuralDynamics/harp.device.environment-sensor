[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "harp-env-sensor"
description = "Interface for data acquisition and control of Harp Environment Sensor devices."
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Allen Institute for Neural Dynamics"}]
classifiers = [
    "Programming Language :: Python :: 3",
]
readme = "README.md"
dynamic = ["version"]

dependencies = [
    "harp-protocol",
    "harp-device",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "harp>=0.5.0",
    "pytest>=8",
]

[tool.setuptools_scm]
root = "../.."

[tool.setuptools.packages.find]
where = ["src"]
include = ["harp*"]
